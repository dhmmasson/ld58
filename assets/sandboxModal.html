<!-- Sandbox Modal -->
<div
  class="modal fade"
  id="sandboxModal"
  tabindex="-1"
  aria-labelledby="sandboxModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="sandboxModalLabel">Configure Sandbox</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="row g-2 mb-2 align-items-end">
          <div class="col-auto">
            <label for="colorSelect" class="form-label">Colors:</label>
            <select id="colorSelect" class="form-select">
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <div class="col-auto">
            <label for="dimSelect" class="form-label">Dimension:</label>
            <select id="dimSelect" class="form-select">
              <option value="1D">1D</option>
              <option value="2D">2D</option>
            </select>
          </div>
          <div class="col-auto">
            <label class="form-label mb-1">Score:</label>
            <div class="d-flex flex-row gap-2">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="scorePairs"
                  name="scoreType"
                  value="pairs"
                />
                <label class="form-check-label" for="scorePairs">pairs</label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="scoreLine"
                  name="scoreType"
                  value="line"
                />
                <label class="form-check-label" for="scoreLine">line</label>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="scoreSquare"
                  name="scoreType"
                  value="square"
                />
                <label class="form-check-label" for="scoreSquare">square</label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
        <button
          type="button"
          class="btn btn-primary"
          id="sandboxBtn"
          data-bs-dismiss="modal"
        >
          Start Sandbox
        </button>
      </div>
    </div>
  </div>
</div>
