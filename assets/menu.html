<div id="main-menu" class="main-menu container-fluid p-0">
  <h2>Tutoriel</h2>
  <div
    class="tutorialSection d-flex flex-wrap justify-content-center mb-4 mt-3"
    id="tutorialSection"
  ></div>
  <div class="dailySection d-flex flex-column align-items-center mb-4">
    <h2>Daily Challenges</h2>
    <div class="d-flex flex-wrap justify-content-center">
      <button
        class="dailyButton btn btn-outline-dark btn-sm me-2 mb-2"
        id="daily1D"
      >
        1D - 4 Colors
      </button>
      <button
        class="dailyButton btn btn-outline-dark btn-sm me-2 mb-2"
        id="daily2D3"
      >
        2D - 3 Colors
      </button>
      <button
        class="dailyButton btn btn-outline-dark btn-sm mb-2"
        id="daily2D4"
      >
        2D - 4 Colors
      </button>
    </div>
  </div>
  <div class="sandboxSection d-flex flex-column align-items-center mb-4">
    <h2>Sandbox</h2>
    <button
      class="btn btn-outline-primary"
      data-bs-toggle="modal"
      data-bs-target="#sandboxModal"
    >
      Configure Sandbox
    </button>
  </div>
  <div class="settingsSection d-flex flex-column align-items-center mb-4">
    <h2>Settings</h2>
    <button
      class="btn btn-outline-secondary"
      data-bs-toggle="modal"
      data-bs-target="#settingsModal"
    >
      Open Settings
    </button>
  </div>
</div>
