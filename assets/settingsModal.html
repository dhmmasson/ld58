<!-- Settings Modal -->
<div
  class="modal fade"
  id="settingsModal"
  tabindex="-1"
  aria-labelledby="settingsModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="settingsModalLabel">Settings</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="row g-2 mb-2">
          <div class="col-auto">
            <label for="paletteSelect" class="form-label">Palette:</label>
            <select id="paletteSelect" class="form-select"></select>
          </div>
          <div class="col-auto d-flex align-items-center">
            <label for="cbCheckbox" class="form-label me-2 mb-0"
              >Colorblind Mode</label
            >
            <input type="checkbox" id="cbCheckbox" class="form-check-input" />
          </div>
        </div>
        <button
          class="leaderboardButton btn btn-outline-dark btn-sm mt-2"
          id="leaderboardBtn"
        >
          LeaderBoard
        </button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
